<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f1eee6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0f0d" />
    <meta name="description" content="Monopoly w przeglądarce: graj ze znajomymi albo z botami." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Monopoly Online</title>
    <script>
      try {
        var storedTheme = localStorage.getItem('monopoly_theme')
        if (storedTheme === 'light' || storedTheme === 'dark') document.documentElement.dataset.theme = storedTheme
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
